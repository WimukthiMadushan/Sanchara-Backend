services:
  mongodb:
    image: mongo:6.0.3
    container_name: event-management-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  spring-boot-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: event-management-service
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/event-management-service
    depends_on:
      - mongodb
    volumes:
      - ./target/EventManagmentSystem-0.0.1-SNAPSHOT.jar:/app/app.jar

volumes:
  mongodb_data:
